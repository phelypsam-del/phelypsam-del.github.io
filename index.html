<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hammerfall Games</title>
<meta name="description" content="Games by Hammerfall Games: Ironclad Duel, Testament of the Star, and more on the way.">
<meta name="theme-color" content="#121110">
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; background:#121110; color:#ece6d8;
    font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  h1{
    margin:56px 20px 36px; font-size:15px; font-weight:600;
    letter-spacing:.32em; text-transform:uppercase; color:#a39c8c; text-align:center;
  }
  .grid{
    width:100%; max-width:760px; padding:0 20px 64px;
    display:grid; gap:20px; grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  }
  .tile{
    position:relative; display:block; aspect-ratio:1/1; overflow:hidden;
    border-radius:10px; background:#1b1a17; text-decoration:none; color:#fff;
    transition:transform .15s ease;
  }
  .tile:hover,.tile:focus-visible{transform:scale(1.03)}
  .tile:focus-visible{outline:2px solid #ff8a2a; outline-offset:3px}
  .tile img,.tile svg{position:absolute; inset:0; width:100%; height:100%; display:block; object-fit:cover}
  .tile img{image-rendering:pixelated}
  .title{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px; padding:16px; text-align:center;
    background:rgba(8,7,6,.82); opacity:0; transition:opacity .15s ease;
  }
  .title b{font-size:22px; font-weight:700; line-height:1.15}
  .title small{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:#c9c1ae}
  .tile:hover .title,.tile:focus-visible .title{opacity:1}
  /* phones and tablets can't hover, so the title sits along the bottom */
  @media (hover:none){
    .title{inset:auto 0 0 0; opacity:1; padding:10px 12px; background:rgba(8,7,6,.8)}
    .title b{font-size:16px}
  }
  @media (prefers-reduced-motion:reduce){ .tile,.title{transition:none} }
</style>
</head>
<body>

<h1>Hammerfall Games</h1>

<!--
  ADDING A GAME: copy one whole <a class="tile"> block, then change the
  link (href), the logo (img src) and the title.
-->
<main class="grid">

  <a class="tile" href="https://phelypsam-del.github.io/ironclad/">
    <img src="https://phelypsam-del.github.io/ironclad/icon-192.png" alt="Ironclad Duel logo">
    <span class="title"><b>Ironclad Duel</b><small>Play now</small></span>
  </a>

  <!-- No link yet: add href="YOUR-GAME-LINK" to this tile when the game is playable,
       and swap the <svg> for <img src="your-logo.png" alt="..."> when you have a logo. -->
  <a class="tile" tabindex="0">
    <svg viewBox="0 0 64 64" shape-rendering="crispEdges" role="img" aria-label="Testament of the Star logo">
      <rect width="64" height="64" fill="#07060a"/>
      <rect x="30" y="8" width="4" height="26" fill="#c21f25"/>
      <rect x="19" y="19" width="26" height="4" fill="#c21f25"/>
      <rect x="27" y="16" width="10" height="10" fill="#ff5a4d"/>
      <polygon points="0,64 10,34 20,64" fill="#150d10"/>
      <polygon points="14,64 26,40 38,64" fill="#1a0f12"/>
      <polygon points="30,64 42,36 54,64" fill="#150d10"/>
      <polygon points="46,64 57,30 68,64" fill="#1a0f12"/>
    </svg>
    <span class="title"><b>Testament of the Star</b><small>Coming soon</small></span>
  </a>

</main>

</body>
</html>
