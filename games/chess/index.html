<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Coach · Hammerfall Games</title>
<meta name="description" content="Play chess against eight computer opponents from 400 to 2500 Elo, or a friend on the same device. A coach rates every move. Works offline.">
<meta name="theme-color" content="#1c1a17">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#1c1a17;--panel:#26231f;--panel2:#2e2a25;--line:#3b362f;--text:#efe8dc;--muted:#a89e8f;--light:#eedbb6;--dark:#b2875b;--accent:#e4b54e;--bs:min(92vw,560px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a2621,var(--bg) 60%);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:18px 10px}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start;width:100%;max-width:1060px}
.left{display:flex;flex-direction:column;gap:8px}
.boardwrap{display:flex;gap:10px;align-items:stretch}
.evalbar{width:14px;border-radius:7px;background:#3a3631;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #0004}
.evalbar .top{transition:flex-basis .5s ease}
.evalbar .bot{flex:1}
#board{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);height:var(--bs);width:var(--bs);aspect-ratio:1;border-radius:6px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.55);position:relative;user-select:none;-webkit-user-select:none;touch-action:none}
.sq{position:relative;min-width:0;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:var(--light)}.sq.d{background:var(--dark)}
.sq .hl{position:absolute;inset:0;pointer-events:none}
.sq.last .hl{background:rgba(245,205,50,.42)}
.sq.sel .hl{background:rgba(70,160,90,.6)}
.sq.check .hl{background:radial-gradient(circle,rgba(255,30,30,.95) 0%,rgba(255,30,30,.55) 45%,transparent 75%)}
.sq.hint{box-shadow:inset 0 0 0 4px #4b93ff}
.sq.mine:hover .hl{background:rgba(255,255,255,.18)}
.sq.sel.mine:hover .hl{background:rgba(70,160,90,.6)}
.dot{position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(25,25,25,.3);z-index:2;pointer-events:none}
.ring{position:absolute;inset:5%;border-radius:50%;border:calc(var(--bs)/90) solid rgba(25,25,25,.32);z-index:2;pointer-events:none}
.sq.tgt:hover{filter:brightness(1.1)}
.sq.over{box-shadow:inset 0 0 0 4px rgba(255,255,255,.75)}
.sq.mine{cursor:grab}
.pc.lifted{opacity:.25}
.pc.ghost{position:fixed;left:0;top:0;z-index:100;pointer-events:none;width:calc(var(--bs)/8);height:calc(var(--bs)/8);transform:translate(-50%,-55%) scale(1.12);display:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.pc.ghost.on{display:block}
body.dragging,body.dragging *{cursor:grabbing!important}
.pc{width:100%;height:100%;z-index:3;position:relative;pointer-events:none;display:block}
.pc svg{width:100%;height:100%;display:block}
.coord{position:absolute;font-size:calc(var(--bs)/48);font-weight:700;z-index:1;pointer-events:none}
.coord.rk{top:3px;left:4px}.coord.fl{bottom:2px;right:4px}
.sq.l .coord{color:var(--dark)}.sq.d .coord{color:var(--light)}
.under{display:flex;justify-content:space-between;align-items:center;padding-left:24px;color:var(--muted);font-size:13px;min-height:22px}
.caps{display:flex;align-items:center;min-height:22px}
.caps .cp{display:inline-block;width:22px;height:22px;margin-right:-6px;vertical-align:middle}
.caps .cp svg{width:100%;height:100%}
.caps small{font-family:system-ui,sans-serif;letter-spacing:0;font-size:12px;margin-left:6px;color:var(--muted)}
.panel{width:min(92vw,360px);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:20px;letter-spacing:.3px;display:flex;justify-content:space-between;align-items:baseline}
h1 span{font-size:12px;color:var(--muted);font-weight:500}
.status{padding:10px 12px;border-radius:8px;background:var(--panel2);font-weight:600;display:flex;align-items:center;gap:8px}
.status .pip{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid #0006}
.status.check{background:#5a2522;color:#ffd9d4}
.status.think .pip{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.ell{display:inline-block;overflow:hidden;vertical-align:bottom;width:0;animation:ell 1.4s steps(4,end) infinite}
@keyframes ell{to{width:1.25em}}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text);background:#35302a;border:1px solid var(--line);border-radius:20px;padding:2px 10px 2px 8px;margin-left:10px}
.tchip i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:bob 1s infinite ease-in-out}
.tchip i:nth-child(2){animation-delay:.15s}.tchip i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
.sq.ponder .hl{background:rgba(90,150,255,.32);animation:pond 1s ease-in-out infinite}
.sq.ponder-to .hl{background:radial-gradient(circle,rgba(90,150,255,.45) 0 22%,transparent 24%)}
.sq.ponder-to.has .hl{background:none;box-shadow:inset 0 0 0 4px rgba(90,150,255,.55)}
@keyframes pond{50%{background:rgba(90,150,255,.16)}}
.pc.ghost.glide{animation:lift .15s ease-out}
@keyframes lift{from{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}}
.card{border-radius:10px;padding:12px;background:var(--panel2);border-left:4px solid var(--q,#666);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(4px);opacity:.3}}
.card .t{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:3px}
.badge{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:2px 7px;border-radius:20px;background:var(--q,#666);color:#16130f}
.card .x{color:#d9d0c2;font-size:14px}
.ai{font-size:14px;color:#d9d0c2;background:#221f1b;border-radius:8px;padding:10px 12px;border:1px dashed var(--line)}
.ai b{color:var(--text)}
.ai .warn{color:#ffb4a6;display:block;margin-top:4px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.btn{background:#35302a;border:1px solid var(--line);border-radius:8px;padding:8px 4px;font-size:13px;font-weight:600}
.btn:hover:not(:disabled){background:#433c34}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--accent);color:#1d1a15;border-color:transparent}
.btn.pri:hover{background:#f0c462}
.moves{background:#1f1d19;border-radius:8px;max-height:210px;overflow:auto;font-size:14px;padding:6px 0;font-variant-numeric:tabular-nums}
.mrow{display:grid;grid-template-columns:34px 1fr 1fr;padding:2px 10px}
.mrow:nth-child(odd){background:#25221e}
.mrow .n{color:var(--muted)}
.mv{display:flex;align-items:center;gap:5px}
.qd{width:8px;height:8px;border-radius:50%;flex:none}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.overlay{position:fixed;inset:0;background:rgba(10,9,8,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(94vw,400px);box-shadow:0 20px 60px #000a}
.modal h2{margin:0 0 4px;font-size:22px}
.modal p{margin:0 0 14px;color:var(--muted)}
.opt{display:grid;gap:6px;margin-bottom:14px}
.opt .lab{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:9px 6px;border-radius:8px;border:1px solid var(--line);background:#302b26;font-weight:600;font-size:14px}
.seg button.on{background:var(--accent);color:#1d1a15;border-color:transparent}
.seg button small{display:block;font-weight:500;font-size:11px;opacity:.75}
.promo{display:flex;gap:8px;justify-content:center}
.promo button{width:76px;height:76px;border-radius:10px;background:var(--light);border:none;padding:6px;display:flex;align-items:center;justify-content:center}
.promo button svg{width:100%;height:100%}
.promo button:hover{background:#f7e7c6}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0 16px}
.sum div{background:var(--panel2);border-radius:8px;padding:8px;text-align:center;font-size:12px;color:var(--muted)}
.sum b{display:block;font-size:20px;color:var(--text)}
.full{width:100%;padding:11px;font-size:15px}

.prow{display:flex;align-items:center;gap:10px;padding-left:24px;min-height:42px}
.who{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap}
.who .av{width:30px;height:30px}
.elo{color:var(--muted);font-weight:500;font-size:12px}
.prow .caps{flex:1;min-width:0}
.prow .tchip{margin-left:0}
.tchip[hidden],.clock[hidden]{display:none}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px;background:#2e2a25;border:1px solid var(--line);border-radius:6px;padding:3px 12px;min-width:88px;text-align:right;color:var(--muted)}
.clock.run{background:#efe8dc;color:#1c1a17;border-color:transparent}
.clock.low.run{background:#c2372f;color:#fff}
.clock.low{color:#ff9d93}
.av{display:inline-block}.av svg{width:100%;height:100%;display:block}
.opening{display:flex;gap:10px;align-items:baseline;background:#221f1b;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px}
.opening .olab{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;flex:none}
.opening .eco{color:var(--accent);font-weight:700;margin-right:6px;font-size:12px}
.opening.flash{animation:oflash 1.2s ease}
@keyframes oflash{0%{border-color:var(--accent);background:#3d3322}}
.botbox{display:flex;gap:10px;align-items:flex-start;background:#221f1b;border-radius:10px;padding:10px 12px;border:1px solid var(--line)}
.botbox[hidden]{display:none}
.botbox .av{width:40px;height:40px;flex:none}
.botbox .bn{font-weight:700;font-size:14px}.botbox .bn small{color:var(--muted);font-weight:500;margin-left:6px;font-size:12px}
.botbox .say{display:inline-block;background:#35302a;border-radius:3px 12px 12px 12px;padding:6px 11px;margin-top:5px;font-size:14px;color:#ece4d6;animation:pop .25s ease}
.botbox .pl{font-size:13px;color:var(--muted);margin-top:5px}
.botbox .pl b{color:var(--text)}
.botbox .warn{color:#ffb4a6}
.btn.warn{background:#7a2a25;border-color:#a6392f;color:#fff}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.modal.wide{width:min(96vw,580px);max-height:94vh;overflow:auto}
.seg.wrap{flex-wrap:wrap}.seg.wrap button{flex:1 1 80px}
.botgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.botcard{display:flex;gap:10px;align-items:center;text-align:left;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#302b26}
.botcard:hover{background:#3a342d}
.botcard.on{border-color:var(--accent);background:#3b3324;box-shadow:0 0 0 1px var(--accent)}
.botcard .av{width:38px;height:38px;flex:none}
.botcard b{display:block;font-size:14px}.botcard .e{font-size:12px;color:var(--accent);font-weight:700;margin-left:4px}
.botcard small{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.myr{float:right;text-transform:none;letter-spacing:0;color:var(--text);font-weight:600}
.endbot{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:10px 12px;margin-bottom:4px;font-size:14px}
.endbot .av{width:40px;height:40px;flex:none}
.rating{text-align:center;margin:-4px 0 14px;font-weight:600}
.rating .up{color:#3fd18f}.rating .dn{color:#e5463f}
@media(max-width:520px){.botgrid{grid-template-columns:1fr}.clock{font-size:17px;min-width:72px}}
.credit{font-size:11px;color:#7d7466}.credit a{color:#a89e8f}
.botcard.friend{grid-column:1/-1;border-style:dashed}
.opt[hidden]{display:none}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}.tog input{width:18px;height:18px;accent-color:var(--accent)}
.endbot[hidden]{display:none}
.home{font-size:13px;color:var(--muted);text-decoration:none;margin-bottom:-6px}.home:hover{color:var(--text)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f3eee4"/><stop offset="1" stop-color="#d6cdbb"/></linearGradient>
<linearGradient id="gb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a534d"/><stop offset=".45" stop-color="#2e2a27"/><stop offset="1" stop-color="#141211"/></linearGradient>
</defs></svg>
<div class="app">
  <div class="left">
    <div class="prow"><div class="who" id="oppWho"></div><span class="tchip" id="tchip" hidden><i></i><i></i><i></i>Thinking</span><span class="caps" id="capTop"></span><span class="clock" id="clkTop" hidden></span></div>
    <div class="boardwrap">
      <div class="evalbar" title="Evaluation"><div class="top" id="evTop"></div><div class="bot" id="evBot"></div></div>
      <div id="board"></div>
    </div>
    <div class="prow"><div class="who" id="meWho"></div><span class="caps" id="capBot"></span><span class="clock" id="clkBot" hidden></span></div>
  </div>
  <aside class="panel">
    <a class="home" href="../">← All games</a>
    <h1>Chess Coach <span id="sideTxt"></span></h1>
    <div class="opening" id="opening"><span class="olab">Opening</span><span id="openTxt">Starting position</span></div>
    <div class="status" id="status"><span class="pip"></span><span id="statusTxt">Your move</span></div>
    <div class="botbox" id="ai" hidden></div>
    <div id="card"></div>
    <div class="btns">
      <button class="btn" id="flipBtn" title="Flip the board">Flip</button>
      <button class="btn" id="resignBtn" title="Resign this game">Resign</button>
      <button class="btn pri" id="newBtn">New game</button>
    </div>
    <div class="moves" id="moves"></div>
    <div class="meta"><span id="modeTxt"></span><span id="evalTxt"></span></div>
    <div class="credit">Pieces: “cburnett” by <a href="https://en.wikipedia.org/wiki/User:Cburnett" target="_blank" rel="noopener">Colin M.L. Burnett</a>, <a href="https://www.gnu.org/licenses/gpl-2.0.txt" target="_blank" rel="noopener">GPLv2+</a></div>
  </aside>
</div>

<div class="overlay" id="setup">
  <div class="modal wide">
    <h2>New game</h2>
    <p>Pick a time control and an opponent. The coach rates every move you make.</p>
    <div class="opt"><div class="lab">Mode</div><div class="seg wrap" id="modeSeg"></div></div>
    <div class="opt"><div class="lab">Opponent <span id="myRating" class="myr"></span></div><div class="botgrid" id="botGrid"></div></div>
    <div class="opt" id="flipOpt" hidden><label class="tog"><input type="checkbox" id="autoFlip" checked> Turn the board around after each move</label></div>
    <div class="opt" id="sideOpt"><div class="lab">Play as</div>
      <div class="seg" id="sideSeg"><button data-v="w" class="on">White</button><button data-v="b">Black</button><button data-v="r">Random</button></div></div>
    <button class="btn pri full" id="startBtn">Start game</button>
  </div>
</div>

<div class="overlay" id="promoOv">
  <div class="modal" style="width:auto"><h2 style="text-align:center;margin-bottom:14px">Promote to</h2><div class="promo" id="promoBox"></div></div>
</div>

<div class="overlay" id="endOv">
  <div class="modal">
    <h2 id="endTitle"></h2>
    <p id="endSub"></p>
    <div class="endbot" id="endBot"></div>
    <div class="sum" id="endSum"></div>
    <div class="rating" id="endRating"></div>
    <div class="btns" style="grid-template-columns:1fr 1fr 1fr">
      <button class="btn" id="reviewBtn">View board</button>
      <button class="btn" id="rematchBtn">Rematch</button>
      <button class="btn pri" id="againBtn">New game</button>
    </div>
  </div>
</div>

<script>
/* ================= ENGINE ================= */
const VAL={P:100,N:320,B:330,R:500,Q:900,K:20000};
const NAME={P:'pawn',N:'knight',B:'bishop',R:'rook',Q:'queen',K:'king'};
const GLYPH={K:'♚',Q:'♛',R:'♜',B:'♝',N:'♞',P:'♟'};
const VS='︎';
/* Piece set "cburnett" by Colin M.L. Burnett — https://en.wikipedia.org/wiki/User:Cburnett

  for(const m of order(legal(true))){make(m);const s=-qs(-bt,-a,d+1);unmake(m);if(s>=bt)return s;if(s>a)a=s;}
  return a;
}

  for(const m of order(ms)){make(m);const s=-negamax(d-1,-bt,-a,ply+1);unmake(m);if(s>=bt)return s;if(s>a)a=s;}
  return a;
}
function searchRoot(depth,noise){

  for(const m of ms){make(m);const s=-negamax(depth-1,-INF,noise?INF:-alpha,1);unmake(m);
    const ns=s+(noise?(Math.random()*2-1)*noise:0);
    if(ns>bestS){bestS=ns;best=m;raw=s;}if(s>alpha)alpha=s;}
  return{move:best,score:raw};
}

    if(o.type==='mate')return{title:`Checkmate — ${W} wins! 🎉`,sub:'Great game, both of you.'};
    if(o.type==='resign')return{title:`${L} resigned`,sub:`${W} wins.`};
    if(o.type==='time')return{title:`${L} ran out of time`,sub:`${W} wins on the clock.`};
  }
  if(o.type==='mate')return o.winner===S.human?{title:`Checkmate — you beat ${n}! 🎉`,sub:'Nicely done.'}:{title:`Checkmate — ${n} wins`,sub:'Shake it off and try again.'};
  if(o.type==='resign')return{title:'You resigned',sub:`${n} wins this one.`};
  if(o.type==='time')return o.winner===S.human?{title:`${n} ran out of time — you win! ⏱`,sub:'Won on the clock.'}:{title:'You ran out of time',sub:`${n} wins on the clock.`};
  if(o.type==='timedraw')return{title:'Draw',sub:'Time ran out, but the other side can\'t checkmate with what\'s left.'};
  const why={stalemate:'Stalemate — the side to move has no legal moves but isn\'t in check.',fifty:'50 moves without a capture or pawn move.',rep:'The same position happened three times.',material:'Neither side has enough material to checkmate.'}[o.type];
  return{title:'Draw',sub:why};
}
function showEnd(gid){
  if(!S.over||(gid&&gid!==S.gid))return;
  const e=endText();$('endTitle').textContent=e.title;$('endSub').textContent=e.sub;
  const B=S.bot;
  $('endBot').hidden=!!S.local;
  $('endBot').innerHTML=`${avatar(B)}<div><b>${B.name}</b> <span style="color:var(--muted)">${B.elo}</span><div style="margin-top:2px">“${S.chat?S.chat.text:''}”</div></div>`;
  const accOf=arr=>arr.length?Math.round(100*arr.reduce((a,h)=>a+Math.max(0,1-Math.min(h.loss,400)/400),0)/arr.length)+'%':'—';
  if(S.local){
    const wm=S.hist.filter((h,i)=>h.q&&i%2===0),bm=S.hist.filter((h,i)=>h.q&&i%2===1),bl=a=>a.filter(h=>h.q==='blunder'||h.q==='mistake').length;
    $('endSum').innerHTML=`<div><b>${accOf(wm)}</b>White accuracy</div><div><b>${accOf(bm)}</b>Black accuracy</div><div><b>${Math.ceil(S.hist.length/2)}</b>moves</div>
    <div><b style="color:${Q.best.col}">${wm.filter(h=>/best|excellent|book/.test(h.q)).length}</b>White book / best</div><div><b style="color:${Q.best.col}">${bm.filter(h=>/best|excellent|book/.test(h.q)).length}</b>Black book / best</div><div><b style="color:${Q.blunder.col}">${bl(wm)} · ${bl(bm)}</b>mistakes W · B</div>`;
    $('endRating').innerHTML='<span style="color:var(--muted)">Two-player games aren\'t rated.</span>';
    $('endOv').classList.add('on');return;
  }
  const hm=S.hist.filter(h=>h.q);const cnt=k=>hm.filter(h=>h.q===k).length;
  const acc=hm.length?Math.round(100*hm.reduce((a,h)=>a+Math.max(0,1-Math.min(h.loss,400)/400),0)/hm.length):0;
  $('endSum').innerHTML=`<div><b>${hm.length?acc+'%':'—'}</b>accuracy</div><div><b style="color:${Q.best.col}">${cnt('best')+cnt('excellent')+cnt('book')}</b>book / best</div><div><b style="color:${Q.good.col}">${cnt('good')}</b>good</div>
  <div><b style="color:${Q.inacc.col}">${cnt('inacc')}</b>inaccuracies</div><div><b style="color:${Q.mistake.col}">${cnt('mistake')}</b>mistakes</div><div><b style="color:${Q.blunder.col}">${cnt('blunder')}</b>blunders</div>`;
  const rc=S.ratingChange;
  $('endRating').innerHTML=rc?`Your rating: ${rc[0]} → <b>${rc[1]}</b> <span class="${rc[1]>=rc[0]?'up':'dn'}">(${rc[1]>=rc[0]?'+':''}${rc[1]-rc[0]})</span>`:'<span style="color:var(--muted)">Game too short to be rated.</span>';
  $('endOv').classList.add('on');
}
/* ---- new-game menu ---- */
const pref={side:store.get('side','w'),bot:store.get('bot','mira'),mode:store.get('mode','blitz3'),autoFlip:store.get('autoFlip',true)};
function buildMenu(){
  $('modeSeg').innerHTML=MODES.map(m=>`<button data-v="${m.id}" class="${m.id===pref.mode?'on':''}">${m.name}<small>${m.sub}</small></button>`).join('');
  $('botGrid').innerHTML=`<button class="botcard friend${pref.bot==='friend'?' on':''}" data-v="friend">${avatar(FRIEND)}<span><b>Play a friend <span class="e">2P</span></b><small>${FRIEND.tag}</small></span></button>`+
    BOTS.map(B=>`<button class="botcard${B.id===pref.bot?' on':''}" data-v="${B.id}">${avatar(B)}<span><b>${B.name} <span class="e">${B.elo}</span></b><small>${B.tag}</small></span></button>`).join('');
  $('autoFlip').checked=pref.autoFlip!==false;syncMenu();
  [...$('sideSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.v===pref.side));
  $('myRating').textContent='Your rating: '+store.get('rating',800);
}
function seg(id){const el=$(id);el.onclick=e=>{const b=e.target.closest('button');if(!b||b.parentElement!==el)return;[...el.children].forEach(x=>x.classList.toggle('on',x===b));};}
seg('sideSeg');seg('modeSeg');seg('botGrid');
function syncMenu(){const f=$('botGrid').querySelector('.on');const fr=f&&f.dataset.v==='friend';$('sideOpt').hidden=fr;$('flipOpt').hidden=!fr;}
$('botGrid').addEventListener('click',()=>setTimeout(syncMenu));
const segVal=id=>$(id).querySelector('.on').dataset.v;
function openMenu(){buildMenu();$('endOv').classList.remove('on');$('setup').classList.add('on');}
$('startBtn').onclick=()=>{
  pref.side=segVal('sideSeg');pref.bot=segVal('botGrid');pref.mode=segVal('modeSeg');pref.autoFlip=$('autoFlip').checked;store.set('autoFlip',pref.autoFlip);
  store.set('side',pref.side);store.set('bot',pref.bot);store.set('mode',pref.mode);
  startGame(pref.side,pref.bot,pref.mode);
};
$('newBtn').onclick=openMenu;
$('againBtn').onclick=openMenu;
$('rematchBtn').onclick=()=>startGame(pref.side,pref.bot,pref.mode);
$('reviewBtn').onclick=()=>$('endOv').classList.remove('on');
$('flipBtn').onclick=()=>{S.flip=!S.flip;render();};
$('setup').onclick=e=>{if(e.target.id==='setup'&&S.human)$('setup').classList.remove('on');};
// boot: show a board behind the menu
resetPos();S={gid:0,human:null,bot:botById(pref.bot),mode:modeById('casual'),hist:[],keys:[posKey()],over:null,busy:false,flip:false,sel:null,targets:[],evalW:0,legal:[],clock:{w:0,b:0},
  card:{q:null,title:'Welcome',text:'Pick a mode and an opponent to begin.'},chat:null};
render();openMenu();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{}));
</script>
